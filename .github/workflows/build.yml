name: 📦 Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
        with:
          submodules: true

      -  uses: pnpm/action-setup@v4
         with:
           version: 10

      - run: pnpm install
      
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: "github-pages"
          path: "build/client/*"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4